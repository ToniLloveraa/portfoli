<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><div class="wrap">
  <a class="brand" href="#home" id="brand"></a>
  <nav>
    <a href="#home">Home</a><a href="#experience">Experience</a><a href="#skills">Skills</a><a href="#projects">Projects</a>
  </nav>
  <div class="icons" id="icons"></div>
</div></header>

<main>
<div class="wrap" id="home">
  <div class="hero">
    <div>
      <p class="hi">Hi, I'm</p>
      <h1 id="name"></h1>
      <p class="role" id="role"></p>
      <p class="intro" id="intro"></p>
      <div class="btns">
        <a class="btn primary" id="cv" download>Download CV</a>
        <a class="btn" href="#projects">Projects</a>
      </div>
    </div>
    <div id="avatar"></div>
  </div>
  <div class="stats" id="stats"></div>
</div>

<section id="experience"><div class="wrap"><h2>Experience</h2><div class="timeline" id="timeline"></div></div></section>
<section id="skills"><div class="wrap"><h2>Skills</h2><div id="skillList"></div></div></section>
<section id="projects"><div class="wrap"><h2>Projects</h2><div class="grid" id="projectGrid"></div></div></section>
</main>

<footer><div class="wrap">
  <span>© Developer Portfolio by <a id="footName" href="#"></a></span>
  <span class="gh" id="gh"></span>
</div></footer>

<script src="data.js"></script>
<script>
const $ = id => document.getElementById(id);
function el(tag, props = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) k === "class" ? n.className = v : n.setAttribute(k, v);
  kids.forEach(k => n.append(k));
  return n;
}
const tags = list => el("div", {class:"tags"}, ...(list||[]).map(t => el("span", {class:"tag"}, t)));
const ICONS = {
  github:'<svg viewBox="0 0 24 24"><path d="M12 .5a11.5 11.5 0 0 0-3.64 22.41c.58.1.79-.25.79-.56v-2c-3.2.7-3.88-1.37-3.88-1.37-.52-1.33-1.28-1.69-1.28-1.69-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.18 1.76 1.18 1.03 1.76 2.69 1.25 3.35.96.1-.74.4-1.25.73-1.54-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.28 1.18-3.09-.12-.29-.51-1.46.11-3.05 0 0 .97-.31 3.17 1.18a11 11 0 0 1 5.77 0c2.2-1.49 3.17-1.18 3.17-1.18.62 1.59.23 2.76.11 3.05.74.81 1.18 1.83 1.18 3.09 0 4.42-2.69 5.39-5.25 5.68.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .5z"/></svg>',
  linkedin:'<svg viewBox="0 0 24 24"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.03-3.04-1.85-3.04-1.86 0-2.14 1.45-2.14 2.94v5.67H9.34V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.45v6.29zM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12zM7.12 20.45H3.56V9h3.56v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.73v20.54C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.73V1.73C24 .77 23.2 0 22.22 0z"/></svg>'
};

document.title = `${SITE.name} | ${SITE.role}`;
$("brand").textContent = SITE.name;
$("name").textContent = SITE.name;
$("role").textContent = SITE.role;
$("intro").textContent = SITE.intro;
$("cv").href = SITE.cv;
$("footName").textContent = SITE.name;
$("footName").href = SITE.github;

// iconos
[["github", SITE.github], ["linkedin", SITE.linkedin]].forEach(([k, url]) => {
  if (!url) return;
  const a = el("a", {href:url, target:"_blank", rel:"noopener", "aria-label":k});
  a.innerHTML = ICONS[k];
  $("icons").append(a);
});

// avatar
if (SITE.photo) $("avatar").append(el("img", {class:"avatar", src:SITE.photo, alt:SITE.name}));
else $("avatar").append(el("div", {class:"avatar", "aria-hidden":"true"}, SITE.name.split(" ").map(w => w[0]).slice(0,2).join("")));

// stats
SITE.stats.forEach(s => $("stats").append(el("div", {class:"stat"}, el("span", {}, s.title), el("strong", {}, s.value))));

// experiencia
SITE.experience.forEach(j => {
  const co = j.companyUrl ? el("a", {class:"co", href:j.companyUrl, target:"_blank", rel:"noopener"}, j.company) : el("span", {class:"co"}, j.company);
  const job = el("article", {class:"job"}, el("time", {}, j.dates), el("h3", {}, j.title), co, el("p", {}, j.description), tags(j.tags));
  if (j.link) job.append(el("div", {class:"links"}, el("a", {href:j.link.url, target:"_blank", rel:"noopener"}, j.link.label)));
  $("timeline").append(job);
});

// skills
SITE.skills.forEach(g => $("skillList").append(el("div", {class:"skill-group"}, el("h3", {}, g.group), tags(g.items))));

// proyectos
SITE.projects.forEach(p => $("projectGrid").append(
  el("a", {class:"card", href:`project.html?p=${encodeURIComponent(p.slug)}`}, el("h3", {}, p.title), el("p", {}, p.summary), tags(p.tags))
));

// footer GitHub
if (SITE.repo) {
  $("gh").append(el("a", {href:SITE.repo, target:"_blank", rel:"noopener"}, "STAR"), el("a", {href:SITE.repo + "/fork", target:"_blank", rel:"noopener"}, "FORK"));
}
</script>
</body>
</html>
